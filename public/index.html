<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escala de Trabalho</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">
  <nav class="rail">
    <div class="rail-logo"><svg viewBox="0 0 24 24"><path d="M13 2 3 14h7l-1 8 11-14h-7l1-6z"/></svg></div>
    <div class="rail-item active" title="Escala de Trabalho"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="2.2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg></div>
    <button class="rail-item clickable" id="railPeople" title="Gerenciar pessoas" hidden><svg viewBox="0 0 24 24"><circle cx="8.5" cy="7.5" r="3"/><path d="M2.5 19.5c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M14.8 19.5c.2-2.6 2.1-4.7 4.6-4.7 2.1 0 3.9 1.4 4.4 3.3"/></svg></button>
    <button class="rail-item clickable" id="railUsers" title="Gerenciar usuários" hidden><svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.6-3 7.6-7 9-4-1.4-7-4.4-7-9V6z"/><path d="M9 12.3l2 2 4-4.4"/></svg></button>
    <button class="rail-item clickable" id="railCategories" title="Gerenciar categorias" hidden><svg viewBox="0 0 24 24"><path d="M3 11l8-8h5a2 2 0 0 1 2 2v5l-8 8a2 2 0 0 1-2.8 0l-4.2-4.2a2 2 0 0 1 0-2.8z"/><circle cx="15" cy="9" r="1.4"/></svg></button>
    <div class="rail-spacer"></div>
    <button class="rail-item clickable" id="railTheme" title="Alternar tema"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <button class="rail-user" id="userDot">?</button>
    <div class="rail-user-name" id="userDotName">—</div>
  </nav>

  <main class="main">
    <header class="topbar">
      <div>
        <h1>Escala de Trabalho</h1>
        <p>Organize os turnos, folgas e plantões da equipe</p>
      </div>
      <div class="topbar-right">
        <div class="avatar-chip" id="avatarChip" title="Sair">
          <div class="dot" id="avatarDot">?</div>
          <div class="info"><b id="avatarName">Carregando…</b><span id="avatarEmail"></span></div>
        </div>
      </div>
    </header>

    <div class="toolbar">
      <div class="toolbar-left">
        <div class="nav-cluster">
          <button class="btn" id="btnToday">Hoje</button>
          <button class="btn icon" id="btnPrev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
          <button class="btn icon" id="btnNext" aria-label="Próximo"><svg viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg></button>
        </div>
        <div class="period-label" id="periodLabel">&nbsp;</div>
        <span class="shift-count" id="shiftCount"></span>
      </div>
      <div class="toolbar-right">
        <div class="segmented" id="viewSeg">
          <button data-view="dia">Dia</button>
          <button data-view="semana">Semana</button>
          <button data-view="mes">Mês</button>
          <div class="sep"></div>
          <button data-filter="presencial" id="btnPresencial">Presencial</button>
        </div>
        <button class="btn icon" id="btnClear" title="Limpar turnos visíveis" hidden><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
        <button class="btn btn-primary" id="btnNew"><svg viewBox="0 0 24 24" style="width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4"><path d="M12 5v14M5 12h14"/></svg> Novo turno</button>
      </div>
    </div>

    <div class="legend" id="legend"></div>

    <div class="canvas">
      <div class="scroller"><div id="calendarRoot"></div></div>
    </div>
  </main>
</div>

<div id="modalRoot"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script src="/app.js"></script>
</body>
</html>
